[package]
name = "ferrous-cx"
version = "0.1.0"
edition = "2021"
description = "FerrousCX platform core orchestration, contracts, streaming administration, and HPC benchmarking tooling"
license = "MIT OR Apache-2.0"

[[bin]]
name = "setup-topics"
path = "src/bin/setup_topics.rs"

[[bin]]
name = "setup-iam"
path = "src/bin/setup_iam.rs"

[[bin]]
name = "workload-generator"
path = "src/bin/workload_generator.rs"

[[bin]]
name = "run-hpc-benchmark"
path = "src/bin/run_hpc_benchmark.rs"

[[bin]]
name = "streaming-admin"
path = "src/bin/streaming_admin.rs"

[[bin]]
name = "delta-sink"
path = "src/bin/delta_sink.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.40", features = ["full"] }
rcgen = "0.13"

[dev-dependencies]
tempfile = "3.17"

[profile.test]
opt-level = 3
debug-assertions = false
overflow-checks = false

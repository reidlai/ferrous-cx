# Topic registry (AD-27). The single source for topic addressing across the platform.
#
# Components read {stream, topic} from here and never concatenate or hardcode names.
# `kafka_name` is the one string Kafka clients (Arroyo, the replayer) use for a topic,
# because Kafka topic names cannot contain "/". The rule is: stream + "." + topic.
# The Iggy-Kafka bridge map (ferrous-streaming/config/bridge/topic-map.toml) is generated
# from this file by ferrous-streaming/scripts/generate-bridge-topic-map.py; never edit it by hand.
#
# `kafka.consume` lists the Kafka consumer groups allowed to read the topic.
# `kafka.produce` says whether a Kafka producer (the replayer) may publish to it.
# Benchmark topics are added by Story 3.11.
version: 1
topics:
  - stream: orders
    topic: intake
    kafka_name: orders.intake
    partitions: 4
    retention: none          # direct raw data injection from stream-replay-rs into Delta Lake (orders_raw_events)
    durability: replicated
    kafka:
      consume: [cg-arroyo-raw]
      produce: true

  - stream: orders
    topic: consolidated
    kafka_name: orders.consolidated
    partitions: 4
    retention: none
    durability: replicated
    kafka:
      consume: [cg-arroyo-state, cg-order-projection, cg-order-saga]
      produce: false

  - stream: orders
    topic: callback
    kafka_name: orders.callback
    partitions: 4
    retention: none
    durability: replicated
    kafka:
      consume: [cg-order-callback]
      produce: false

  - stream: olist
    topic: orders_stream
    kafka_name: olist.orders_stream
    partitions: 4            # [ASSUMPTION: Olist Partitions] match the orders topics until Story 3.10 sets it
    retention: none
    durability: persisted    # an acknowledged produce must mean "on stable storage" (Contract Sheet, section 10)
    kafka:
      consume: [cg-arroyo-olist]
      produce: true

  - stream: olist
    topic: order_items_stream
    kafka_name: olist.order_items_stream
    partitions: 4
    retention: none
    durability: persisted
    kafka:
      consume: [cg-arroyo-olist-items]
      produce: true

  - stream: olist
    topic: order_payments_stream
    kafka_name: olist.order_payments_stream
    partitions: 4
    retention: none
    durability: persisted
    kafka:
      consume: [cg-arroyo-olist-payments]
      produce: true

  - stream: olist
    topic: order_reviews_stream
    kafka_name: olist.order_reviews_stream
    partitions: 4
    retention: none
    durability: persisted
    kafka:
      consume: [cg-arroyo-olist-reviews]
      produce: true

  - stream: benchmark
    topic: hpc_mqbench
    kafka_name: benchmark.hpc_mqbench
    partitions: 4
    retention: none
    durability: persisted
    kafka:
      consume: [cg-arroyo-benchmark]
      produce: true

# ==============================================================================
# FerrousCX Olist Sustained Load Replay Profile (Story 12.4, NFR-3, SM-3)
# Sustained fixed-rate throughput at 25 events per second with zero dropped watermarks
# Targets native Apache Iggy HTTP API on 127.0.0.1:3000 (orders/intake)
# ==============================================================================

[dataset]
input_path = "docs/datasets/olist/olist_orders_dataset.csv"
format = "csv"
timestamp_column = "order_purchase_timestamp"
timestamp_unit = "rfc3339"
shift_columns = [
    "order_approved_at",
    "order_delivered_carrier_date",
    "order_delivered_customer_date",
    "order_estimated_delivery_date"
]
partition_key = "order_id"

[replay]
rate = 25
event_time = "compress"
loop = true
advance_timestamps = true
loop_id_salt = true

[sink]
default_type = "iggy"
default_url = "http://127.0.0.1:3000"
destination = "orders/intake"

# ==============================================================================
# FerrousCX Master Topology Docker Compose Manifest (Story 12.1, Story 16.14, AD-26, AD-24)
# Orchestrates all component services with strict Day-0 container hardening
# ==============================================================================

name: ferrous-cx

services:
  # 0. High-Performance Message Broker & WAL (Apache Iggy Pure-Rust Broker)
  iggy-broker:
    build:
      context: .
      dockerfile: docker/Dockerfile.iggy
    image: ferrous-streaming-iggy:latest
    container_name: ferrous-iggy-broker
    restart: unless-stopped
    command: ["--with-default-root-credentials"]
    user: "10001:10001"
    ports:
      - "${PORT_IGGY_TCP:-8090}:8090"
      - "${PORT_IGGY_HTTP:-3000}:3000"
    volumes:
      - ./config/streaming/iggy.toml:/etc/iggy/iggy.toml:ro
      - ./config/streaming/connectors:/etc/iggy/connectors:ro
      - iggy_data:/data/iggy
      - delta_data:/data/delta
    environment:
      - IGGY_CONFIG_PATH=/etc/iggy/iggy.toml
      - IGGY_NODE_ADVERTISED_ADDRESS=localhost
      - OTEL_SDK_DISABLED=true
      - IGGY_HTTP_JWT_ENCODING_SECRET=${IGGY_HTTP_JWT_ENCODING_SECRET:-}
      - IGGY_HTTP_JWT_DECODING_SECRET=${IGGY_HTTP_JWT_DECODING_SECRET:-}
      - STREAMING_SERVICE_ACCOUNT=${STREAMING_SERVICE_ACCOUNT:-svc_ferrous_streaming}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
    deploy:
      resources:
        limits:
          memory: 256M

  # 1. Identity & Access Management (Kanidm Pure-Rust IdP)
  ferrous-iam:
    build:
      context: ../ferrous-iam
      dockerfile: Dockerfile
    image: ferrous-iam:latest
    container_name: ferrous-iam
    user: "10001:10001"
    restart: unless-stopped
    ports:
      - "${PORT_IAM:-8443}:8443"
      - "3636:3636"
    volumes:
      - ../ferrous-iam/config/server.toml:/etc/kanidm/server.toml:ro
      - ./config/iam/certs:/etc/kanidm/certs:ro
      - kanidm_data:/data
    environment:
      - KANIDM_CONFIG_PATH=/etc/kanidm/server.toml
    healthcheck:
      test: ["CMD", "/sbin/kanidmd", "version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # 2. Vector Database (Qdrant Vector Engine)
  vectordb:
    build:
      context: ../ferrous-vectordb
      dockerfile: Dockerfile
    image: ferrous-vectordb:latest
    container_name: ferrous-vectordb
    user: "10001:10001"
    restart: unless-stopped
    ports:
      - "${PORT_VECTORDB:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - ../ferrous-vectordb/config/config.yaml:/qdrant/config/config.yaml:ro
    environment:
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # 2.5 Pure-Rust Distributed Event Store (SierraDB)
  sierradb:
    image: tqwewe/sierradb:latest
    container_name: ferrous-sierradb
    restart: unless-stopped
    ports:
      - "${PORT_SIERRADB:-9090}:9090"
    volumes:
      - sierradb_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9090' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  # 3. CQRS-ES Order Projection Daemon (Day-0 Defense)
  order-projection:
    build:
      context: ../ferrous-cqrses
      dockerfile: Dockerfile.order_projection
    image: ferrous-cqrses-order-projection:latest
    container_name: ferrous-cqrses-order-projection
    user: "10001:10001"
    restart: unless-stopped
    # Day-0 Hardened Runtime Defense Constraints (AD-24)
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64M
    environment:
      - IGGY_SERVER_ADDRESS=${IGGY_SERVER_ADDRESS:-iggy-broker:8090}
      - IGGY_USERNAME=${IGGY_USERNAME:-iggy}
      - IGGY_PASSWORD=${IGGY_PASSWORD:-iggy}
      - STREAM_NAME=orders
      - TOPIC_ORDERS_EVENTS=events
      - TOPIC_ORDERS_CONSOLIDATED=consolidated
      - CONSUMER_GROUP=cg-order-projection
      - SIERRADB_URL=${SIERRADB_URL:-redis://sierradb:9090}
    depends_on:
      iggy-broker:
        condition: service_healthy
      sierradb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/order_projection", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 4. API Service Gateway (Axum + Axum SSE + Embedded DataFusion)
  ferrous-api:
    build:
      context: ..
      dockerfile: ferrous-api/Dockerfile
    image: ferrous-api:latest
    container_name: ferrous-api
    user: "10001:10001"
    restart: unless-stopped
    # Day-0 Hardened Runtime Defense Constraints (AD-24)
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64M
    ports:
      - "${PORT_API:-8080}:8080"
    volumes:
      - delta_data:/data/delta:ro
    environment:
      - PORT=8080
      - IGGY_SERVER_ADDRESS=${IGGY_SERVER_ADDRESS:-iggy-broker:8090}
      - SIERRADB_URL=${SIERRADB_URL:-redis://sierradb:9090}
      - KANIDM_JWT_SECRET=${KANIDM_JWT_SECRET:-development_kanidm_jwt_secret_32_bytes_minimum!}
      - KANIDM_ISSUER=${KANIDM_ISSUER:-https://iam.ferrouscx.local/oauth2/openid/svc_ferrous_api}
      - DELTA_DATA_DIR=/data/delta
      - DELTA_ORDERS_PATH=/data/delta/orders_current_state
      - RUST_LOG=info
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-true}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-console}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
    depends_on:
      iggy-broker:
        condition: service_healthy
      sierradb:
        condition: service_healthy
      ferrous-iam:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ferrous-api", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 5. Autonomous AI Engine & Copilot Benchmarking (Rig-core)
  ferrous-agent:
    build:
      context: ../ferrous-agent
      dockerfile: Dockerfile
    image: ferrous-agent:latest
    container_name: ferrous-agent
    user: "10001:10001"
    restart: unless-stopped
    # Day-0 Hardened Runtime Defense Constraints (AD-24)
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64M
      - /delta:noexec,nosuid,nodev,size=128M
    ports:
      - "${PORT_AGENT:-8081}:8081"
    environment:
      - PORT=8081
      - RUST_LOG=info
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}
      - LLM_API_BASE=${LLM_API_BASE:-http://host.docker.internal:11434}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - QDRANT_URL=http://vectordb:6333
      - FERROUS_API_URL=http://ferrous-api:8080
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-true}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-console}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    depends_on:
      ferrous-api:
        condition: service_healthy
      vectordb:
        condition: service_healthy
      ferrous-iam:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ferrous-agent", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 6. Svelte 5 Web Operator Studio & Pure-Rust Static Server
  ferrous-frontend:
    build:
      context: ../ferrous-frontend
      dockerfile: Dockerfile
    image: ferrous-frontend:latest
    container_name: ferrous-frontend
    user: "10001:10001"
    restart: unless-stopped
    # Day-0 Hardened Runtime Defense Constraints (AD-24)
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64M
    ports:
      - "${PORT_FRONTEND:-5173}:5173"
    environment:
      - PORT=5173
      - STATIC_DIR=/app/build
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-true}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-console}
    depends_on:
      ferrous-api:
        condition: service_healthy
      ferrous-iam:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/server", "--healthcheck", "--port", "5173"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # 7. Edge Reverse Proxy, TLS Termination & OWASP WAF (Zentinel / Hyper)
  ferrous-reverseproxy:
    build:
      context: ../ferrous-reverseproxy
      dockerfile: Dockerfile
    image: ferrous-reverseproxy:latest
    container_name: ferrous-reverseproxy
    user: "10001:10001"
    restart: unless-stopped
    # Day-0 Hardened Runtime Defense Constraints (AD-24)
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64M
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
    volumes:
      - ../ferrous-reverseproxy/config:/etc/zentinel:ro
    environment:
      - RUST_LOG=info
      - ZENTINEL_CONFIG=/etc/zentinel/zentinel.yaml
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-true}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-console}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
    depends_on:
      ferrous-frontend:
        condition: service_healthy
      ferrous-api:
        condition: service_healthy
      ferrous-iam:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/ferrous-reverseproxy", "--healthcheck", "--health-port", "443"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 9. Ephemeral In-Memory Jaeger All-In-One Container (Story 12.2, AD-23)
  jaeger:
    image: jaegertracing/jaeger:2.3.0
    container_name: jaeger
    restart: unless-stopped
    # Day-0 Hardened Runtime Defense Constraints (AD-24)
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64M
    ports:
      - "${PORT_OTLP_GRPC:-4317}:4317"     # OTLP gRPC receiver
      - "${PORT_OTLP_HTTP:-4318}:4318"     # OTLP HTTP receiver
      - "${PORT_JAEGER_UI:-16686}:16686"   # Jaeger Web UI
    environment:
      - METRICS_STORAGE_TYPE=memory
      - SPAN_STORAGE_TYPE=memory
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:16686/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  kanidm_data:
    name: ferrous_kanidm_data
  qdrant_storage:
    name: ferrous_qdrant_storage
  iggy_data:
    name: ferrous_iggy_data
  delta_data:
    name: ferrous_delta_data
  sierradb_data:
    name: ferrous_sierradb_data

networks:
  default:
    name: ferrous-net
